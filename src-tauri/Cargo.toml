[package]
name = "lieshoucloud-desktop"
version = "0.0.31"
description = "LieShou Cloud Desktop App (Tauri 2 + React 19)"
authors = ["FutureWL"]
edition = "2021"

# Tauri 2 推荐 crate-type 三件套
[lib]
name = "lieshoucloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 在线升级（2026-09 客户仓 · Windows nsis）
tauri-plugin-updater = "2"
# 升级完成后重启应用
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
opt-level = "s"
strip = true
