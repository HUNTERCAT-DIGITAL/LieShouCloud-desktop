[package]
name = "lieshoucloud-desktop"
version = "0.0.1"
description = "LieShou Cloud Desktop App (Tauri 2 + React 19)"
authors = ["FutureWL"]
edition = "2021"

# Tauri 2 推荐 crate-type 三件套
[lib]
name = "lieshoucloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 在线升级（2026-09 客户仓 · Windows nsis / macOS dmg）
tauri-plugin-updater = "2"
# 升级完成后重启应用
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows 专属：沉浸式无边框（SetWindowPos 等 Win32 API）。仅 Windows 平台解析——
# 否则 macOS/Linux 也会拉入 windows-future（windows 0.61 传递依赖）在非 Windows 编译报错。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
opt-level = "s"
strip = true
