name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend (typecheck+build+lint+test)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout (with open/ submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck + Build + Lint + Test
        run: pnpm run typecheck && pnpm run build && pnpm run lint && pnpm run test
        env:
          CI: true
